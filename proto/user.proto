syntax = "proto3";

package user;

service UserService {
  rpc RegisterUser    (RegisterRequest)  returns (UserResponse);
  rpc LoginUser       (LoginRequest)     returns (AuthResponse);
  rpc GetUser         (UserRequest)      returns (UserResponse);
  rpc UpdateUser      (UpdateRequest)    returns (UserResponse);
  rpc DeleteUser      (UserRequest)      returns (DeleteResponse);
  rpc ValidateToken   (TokenRequest)     returns (ValidationResponse);
}

// ─────────────────────────────────────────
//  Requests
// ─────────────────────────────────────────
message RegisterRequest {
  string name     = 1;
  string email    = 2;
  string password = 3;
  string role     = 4; 
}

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message UserRequest {
  string user_id = 1;
}

message UpdateRequest {
  string user_id = 1;
  string name    = 2;
  string email   = 3;
}

message TokenRequest {
  string token = 1;
}

message UserResponse {
  string user_id    = 1;
  string name       = 2;
  string email      = 3;
  string role       = 4;
  string created_at = 5;
  string error      = 6; 
}

message AuthResponse {
  string token   = 1;
  string user_id = 2;
  string role    = 3;
  string error   = 4;
}

message ValidationResponse {
  bool   valid   = 1;
  string user_id = 2;
  string role    = 3;
  string error   = 4;
}

message DeleteResponse {
  bool   success = 1;
  string error   = 2;
}