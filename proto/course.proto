syntax = "proto3";

package course;

service CourseService {
  rpc CreateCourse    (CreateCourseRequest)  returns (CourseResponse);
  rpc GetCourse       (CourseRequest)        returns (CourseResponse);
  rpc ListCourses     (ListCoursesRequest)   returns (CourseList);
  rpc UpdateCourse    (UpdateCourseRequest)  returns (CourseResponse);
  rpc DeleteCourse    (CourseRequest)        returns (DeleteResponse);
  rpc EnrollStudent   (EnrollRequest)        returns (EnrollResponse);
  rpc GetEnrollments  (EnrollmentRequest)    returns (EnrollmentList);
  rpc CreateLesson    (CreateLessonRequest)  returns (LessonResponse);
  rpc GetLessons      (CourseRequest)        returns (LessonList);
}

message CreateCourseRequest {
  string title       = 1;
  string description = 2;
  string instructor  = 3; 
  string category    = 4;
  string level       = 5; 
}

message CourseRequest {
  string course_id = 1;
}

message ListCoursesRequest {
  string category = 1; 
  string level    = 2; 
}

message UpdateCourseRequest {
  string course_id   = 1;
  string title       = 2;
  string description = 3;
  string category    = 4;
  string level       = 5;
}

message EnrollRequest {
  string user_id   = 1;
  string course_id = 2;
}

message EnrollmentRequest {
  string user_id = 1;
}

message CreateLessonRequest {
  string course_id = 1;
  string title     = 2;
  string content   = 3;
  int32  order_num = 4;
}

message CourseResponse {
  string course_id   = 1;
  string title       = 2;
  string description = 3;
  string instructor  = 4;
  string category    = 5;
  string level       = 6;
  string created_at  = 7;
  string error       = 8;
}

message CourseList {
  repeated CourseResponse courses = 1;
  string error                    = 2;
}

message EnrollResponse {
  bool   success     = 1;
  string user_id     = 2;
  string course_id   = 3;
  string enrolled_at = 4;
  string error       = 5;
}

message EnrollmentList {
  repeated EnrollResponse enrollments = 1;
  string error                        = 2;
}

message LessonResponse {
  string lesson_id  = 1;
  string course_id  = 2;
  string title      = 3;
  string content    = 4;
  int32  order_num  = 5;
  string error      = 6;
}

message LessonList {
  repeated LessonResponse lessons = 1;
  string error                    = 2;
}

message DeleteResponse {
  bool   success = 1;
  string error   = 2;
}